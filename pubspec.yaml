name: idiom_detective
description: "Crack the meaning behind every expression. A mobile idiom dictionary with quiz mode, daily cases, and detective challenges."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # State Management
  provider: ^6.1.5

  # Storage
  shared_preferences: ^2.5.3

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.3
  flutter_animate: ^4.5.2

  # Utilities
  share_plus: ^11.0.0
  intl: ^0.20.2
  collection: ^1.19.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/
    - assets/images/
